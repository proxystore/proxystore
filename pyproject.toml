[build-system]
requires = ["setuptools>=77.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "proxystore"
dynamic = ["version"]
authors = [
    {name = "Greg Pauloski"},
    {name = "Globus Labs"},
]
maintainers = [
    {name = "Greg Pauloski", email = "jgpauloski@uchicago.edu"},
]
description = "Pass-by-reference for distributed Python applications via transparent object proxies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    # Click 8.1.4 fails mypy: https://github.com/pallets/click/issues/2558
    "click!=8.1.4",
    "cloudpickle>=3",
    "globus-sdk>=4,<5",
    "pydantic>=2,<3",
    "tomli-w",
    "typing-extensions>=4.6.0 ; python_version<'3.12'",
]

[project.urls]
Homepage = "https://proxystore.dev"
Documentation = "https://docs.proxystore.dev"
Source = "https://github.com/proxystore/proxystore"

[project.optional-dependencies]
all = ["proxystore[endpoints,kafka,redis,zmq]"]
endpoints = [
    "aiosqlite",
    # TODO: Raise the minimum to the first iroh release with the uniffi fix
    # for copying bytes arguments byte-by-byte (see #792).
    "iroh>=1.1,<2",
    "cryptography>=39.0.1",
    "uvloop>=0.18.0",
    "python-daemon",
]
kafka = ["confluent-kafka"]
redis = ["redis>=3.4"]
zmq = ["pyzmq"]

[dependency-groups]
dev = [
    "covdefaults>=2.2",
    "coverage!=7.6.2",
    "mypy",
    "numpy",
    "pandas",
    "polars",
    "pre-commit",
    "pytest",
    "pytest-asyncio>=0.23.2",
    "pytest-timeout",
    "ruff>=0.16",
    "tox>=4.22",
]
docs = [
    "griffe==2.3.0",
    "mkdocs-click==0.9.0",
    "mkdocs-gen-files==0.6.1",
    "mkdocs-literate-nav==0.6.3",
    "mkdocs-material==9.7.7",
    "mkdocs-section-index==0.3.12",
    "mkdocstrings==1.0.6",
    "mkdocstrings-python==2.0.9",
    "mike==2.2.0",
    # Used by mkdocstrings to format signatures
    "ruff",
]

[project.scripts]
proxystore-endpoint = "proxystore.endpoint.cli:cli"
proxystore-globus-auth = "proxystore.globus.cli:cli"

[tool.codespell]
skip = """
.git,
.github,
__pycache__,
build,
dist,
.*egg-info,
docs/publications/index.md,
"""
# These words get caught because they are written as {O}bject in bibtex citations.
ignore-words-list = "pplications,bject,bistream"

[tool.coverage.run]
plugins = ["covdefaults"]
concurrency = ["multiprocessing", "thread"]
omit = [
    "proxystore/mypy_plugin.py",
    "testing/mocked/pydaos.py",
    "testing/scripts/*",
    "version_check.py",
]
parallel = true

[tool.mypy]
python_version = "3.11"
plugins = [
    "mypy.plugins.proper_plugin",
    "proxystore/mypy_plugin.py",
    "pydantic.mypy",
]
check_untyped_defs = true
disable_error_code = "import-untyped"
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# PyDAOS is not available on PyPI so is not installed in the environment.
module = "pydaos"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "testing.*"
allow_incomplete_defs = true
allow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_incomplete_defs = true
allow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::proxystore.warnings.ExperimentalWarning",
    "ignore::DeprecationWarning:proxystore.*",
    "ignore::DeprecationWarning:testing.*",
    "ignore::DeprecationWarning:tests.*",
]
markers = [
    "integration: mark a test as an integration test.",
]
timeout = 60

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff.lint]
# See all rules here: https://docs.astral.sh/ruff/rules/
select = [
    # pyflakes
    "F",
    # pycodestyle
    "E",
    # mccabe
    "C90",
    # isort
    "I",
    # pep8-naming
    "N",
    # pydocstyle
    "D",
    # pyupgrade
    "UP",
    # flake8-2020
    "YTT",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-commas
    "COM",
    # flake8-comprehensions
    "C4",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-pytest-style
    "PT",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # flake8-blind-except
    "BLE",
    # flake8-executable
    "EXE",
    # flynt
    "FLY",
    # refurb
    "FURB",
    # flake8-logging-format
    "G",
    # flake8-import-conventions
    "ICN",
    # flake8-logging
    "LOG",
    # Perflint
    "PERF",
    # pygrep-hooks
    "PGH",
    # flake8-pie
    "PIE",
    # flake8-return
    "RET",
    # flake8-raise
    "RSE",
    # flake8-tidy-imports
    "TID",
    # PyLint
    "PLE", "PLW",
    # ruff-specific
    "RUF",
]
ignore = [
    # Conflicts with the formatter
    "COM812",
    # Do not require docstrings for magic methods
    "D105",
    # Do not require docstrings for __init__ methods
    "D107",
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-values-type = "tuple"

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["proxystore", "tests", "testing"]
order-by-type = false
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"tests/**.py" = ["D10"]
"proxystore/store/*.py" = ["D102"]
"tests/conftest.py" = ["F401"]
"testing/**.py" = ["D10"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.packages.find]
exclude = ["tests*", "testing*"]
namespaces = false

[tool.setuptools_scm]
