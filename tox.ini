[tox]
requires = tox>=4.22
envlist = py{311,312,313,314}, pre-commit, docs

[testenv]
extras = endpoints,kafka,redis,zmq
dependency_groups = dev
commands =
    coverage erase
    coverage run -m pytest {posargs}
    coverage combine --quiet
    coverage report

[testenv:pre-commit]
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:docs]
# The endpoints extra is needed because mkdocs-click imports the CLIs
extras = endpoints
dependency_groups = docs
commands = mkdocs build --strict
